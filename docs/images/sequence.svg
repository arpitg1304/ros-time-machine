<svg width="1280" height="700" viewBox="0 0 1280 700" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="sar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa7c0"/>
    </marker>
    <marker id="sarR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5eead4"/>
    </marker>
    <filter id="ssh" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="700" rx="20" fill="url(#sbg)"/>
  <rect x="1" y="1" width="1278" height="698" rx="19" fill="none" stroke="#243049" stroke-width="1.5"/>
  <text x="64" y="48" font-size="28" font-weight="800" fill="#e2e8f0">Component interaction</text>
  <text x="64" y="76" font-size="15" fill="#94a3b8">From always-on buffering to a finished rosbag — who talks to whom, and in what order.</text>

  <!-- phase bands -->
  <rect x="48" y="128" width="1184" height="84"  rx="10" fill="#ffffff" opacity="0.022"/>
  <rect x="48" y="216" width="1184" height="116" rx="10" fill="#ffffff" opacity="0.022"/>
  <rect x="48" y="336" width="1184" height="332" rx="10" fill="#ffffff" opacity="0.022"/>
  <text x="60" y="148" font-size="12.5" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">① CONTINUOUS BUFFERING</text>
  <text x="60" y="236" font-size="12.5" font-weight="700" fill="#c4b5fd" letter-spacing="0.5">② TRIGGER DETECTION</text>
  <text x="60" y="356" font-size="12.5" font-weight="700" fill="#5eead4" letter-spacing="0.5">③ RECORDING JOB · worker thread</text>

  <!-- lifelines -->
  <!-- centers: Topics 150, Buffer 350, Trigger 550, Recorder 752, Worker 952, rosbag2 1140 -->
  <g stroke-width="1.3" stroke-dasharray="4 5" opacity="0.45">
    <line x1="150" y1="112" x2="150" y2="668" stroke="#93a4c4"/>
    <line x1="350" y1="112" x2="350" y2="668" stroke="#0ea5e9"/>
    <line x1="550" y1="112" x2="550" y2="668" stroke="#a78bfa"/>
    <line x1="752" y1="112" x2="752" y2="668" stroke="#10b981"/>
    <line x1="952" y1="112" x2="952" y2="668" stroke="#14b8a6"/>
    <line x1="1140" y1="112" x2="1140" y2="668" stroke="#22c55e"/>
  </g>

  <!-- lifeline headers -->
  <g filter="url(#ssh)">
    <rect x="74"  y="86" width="152" height="36" rx="10" fill="#16203a" stroke="#3b4a6b" stroke-width="1.3"/>
    <rect x="284" y="86" width="132" height="36" rx="10" fill="#06212f" stroke="#0ea5e9" stroke-width="1.3"/>
    <rect x="484" y="86" width="132" height="36" rx="10" fill="#1a1330" stroke="#a78bfa" stroke-width="1.3"/>
    <rect x="686" y="86" width="132" height="36" rx="10" fill="#062417" stroke="#10b981" stroke-width="1.3"/>
    <rect x="886" y="86" width="132" height="36" rx="10" fill="#06231f" stroke="#14b8a6" stroke-width="1.3"/>
    <rect x="1066" y="86" width="148" height="36" rx="10" fill="#0a2615" stroke="#22c55e" stroke-width="1.3"/>
  </g>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="150" y="109" fill="#cbd5e1">📡 ROS Topics</text>
    <text x="350" y="109" fill="#7dd3fc">Buffer Mgr</text>
    <text x="550" y="109" fill="#c4b5fd">Trigger Mon</text>
    <text x="752" y="109" fill="#6ee7b7">Recorder</text>
    <text x="952" y="109" fill="#5eead4">Worker</text>
    <text x="1140" y="109" fill="#86efac">rosbag2 · MCAP</text>
  </g>

  <!-- activation bars -->
  <rect x="946" y="374" width="12" height="244" rx="3" fill="#14b8a6" opacity="0.55"/>
  <rect x="1134" y="474" width="12" height="110" rx="3" fill="#22c55e" opacity="0.5"/>

  <!-- ================= messages ================= -->
  <g font-size="12.5" fill="#cbd5e1" text-anchor="middle">

    <!-- ① -->
    <line x1="150" y1="178" x2="344" y2="178" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="248" y="172">sensor messages (always)</text>
    <path d="M 350 192 C 398 188, 398 208, 350 204" stroke="#9aa7c0" stroke-width="1.5" fill="none" marker-end="url(#sar)"/>
    <text x="406" y="202" text-anchor="start">store in circular buffer</text>

    <!-- ② -->
    <line x1="150" y1="262" x2="544" y2="262" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="350" y="256">/emergency_stop = true</text>
    <path d="M 550 276 C 598 272, 598 292, 550 288" stroke="#9aa7c0" stroke-width="1.5" fill="none" marker-end="url(#sar)"/>
    <text x="606" y="286" text-anchor="start">evaluate condition · check rate limit</text>
    <line x1="550" y1="318" x2="746" y2="318" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="651" y="312">fire("emergency_stop")</text>

    <!-- ③ -->
    <line x1="752" y1="380" x2="946" y2="380" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="852" y="374">assign recording job</text>

    <line x1="946" y1="414" x2="356" y2="414" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="651" y="408">get_buffered(topics, pre=5s)</text>

    <line x1="350" y1="446" x2="940" y2="446" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sarR)"/>
    <text x="645" y="440" fill="#9fe9da">pre-event messages (t−5 … t0)</text>

    <line x1="958" y1="480" x2="1134" y2="480" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="1046" y="474">create bag · write pre-event</text>

    <line x1="150" y1="516" x2="946" y2="516" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="548" y="510">subscribe → live messages (t0 … t+10s)</text>

    <line x1="958" y1="550" x2="1134" y2="550" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="1046" y="544">write post-event</text>

    <line x1="958" y1="584" x2="1134" y2="584" stroke="#9aa7c0" stroke-width="1.6" marker-end="url(#sar)"/>
    <text x="1046" y="578">close &amp; finalize</text>

    <line x1="946" y1="618" x2="758" y2="618" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#sarR)"/>
    <text x="852" y="612" fill="#9fe9da">recording complete</text>

    <path d="M 752 632 C 800 628, 800 648, 752 644" stroke="#9aa7c0" stroke-width="1.5" fill="none" marker-end="url(#sar)"/>
    <text x="808" y="642" text-anchor="start">publish RecordingStatus(COMPLETED)</text>
  </g>
</svg>
