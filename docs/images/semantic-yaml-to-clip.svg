<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ybg" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="yar" markerWidth="11" markerHeight="11" refX="6.5" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#a78bfa"/>
    </marker>
    <filter id="yshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#ybg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#243049" stroke-width="1.5"/>
  <text x="64" y="58" font-size="30" font-weight="800" fill="#e2e8f0">Describe it in English. Get the clip.</text>
  <text x="64" y="88" font-size="16" fill="#94a3b8">A real event from the demo: Qwen3-VL-4B watched one frame per second and Time Machine saved the 8 s around the drop.</text>

  <!-- YOU WRITE -->
  <g filter="url(#yshadow)">
    <rect x="64" y="118" width="476" height="262" rx="14" fill="#1d1908" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <rect x="64" y="118" width="6" height="262" rx="3" fill="#f59e0b"/>
  <text x="90" y="150" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1.2">YOU WRITE</text>
  <text x="520" y="150" font-size="13" fill="#92732a" text-anchor="end">watch_list.yaml</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#e2e8f0">
    <text x="90" y="186"><tspan fill="#fbbf24">watcher:</tspan></text>
    <text x="107.4" y="210">model: <tspan fill="#cbd5e1">qwen3-vl-4b-instruct</tspan></text>
    <text x="107.4" y="234">cameras: <tspan fill="#cbd5e1">[/camera/front/…/compressed]</tspan></text>
    <text x="107.4" y="258">events:</text>
    <text x="124.8" y="282">- label: <tspan fill="#c4b5fd">object_dropped</tspan></text>
    <text x="142.2" y="306">describe: <tspan fill="#a7f3d0">"An object falls out of</tspan></text>
    <text x="237.9" y="330"><tspan fill="#a7f3d0">the gripper or off the table."</tspan></text>
    <text x="142.2" y="354">profile: <tspan fill="#cbd5e1">manipulation</tspan></text>
  </g>

  <!-- MIDDLE -->
  <g stroke="#a78bfa" stroke-width="2.2" fill="none" marker-end="url(#yar)">
    <path d="M 548 250 L 732 250"/>
  </g>
  <g text-anchor="middle">
    <text x="640" y="212" font-size="14" font-weight="700" fill="#c4b5fd">VLM sees it at T+0.7 s</text>
    <text x="640" y="232" font-size="12.5" fill="#94a3b8">1 frame/s, 4-frame window</text>
    <text x="640" y="276" font-size="12.5" fill="#94a3b8">EventTrigger names that</text>
    <text x="640" y="294" font-size="12.5" fill="#94a3b8">moment in robot time</text>
  </g>

  <!-- YOU GET -->
  <g filter="url(#yshadow)">
    <rect x="740" y="118" width="476" height="262" rx="14" fill="#062417" stroke="#10b981" stroke-width="1.5"/>
  </g>
  <rect x="740" y="118" width="6" height="262" rx="3" fill="#10b981"/>
  <text x="766" y="150" font-size="13" font-weight="700" fill="#6ee7b7" letter-spacing="1.2">YOU GET</text>
  <text x="1196" y="150" font-size="13" fill="#3f7a62" text-anchor="end">one clip directory</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#e2e8f0">
    <text x="766" y="186" fill="#6ee7b7">object_dropped_1793158852_7265…/</text>
    <text x="783.4" y="210">…_0.mcap  <tspan fill="#94a3b8">8 s · 2 topics · 520 msgs</tspan></text>
    <text x="783.4" y="234">event.json</text>
    <text x="800.8" y="258" fill="#cbd5e1">"confidence": <tspan fill="#fbbf24">0.95</tspan>,</text>
    <text x="800.8" y="282" fill="#cbd5e1">"description": <tspan fill="#a7f3d0">"The red cup</tspan></text>
    <text x="818.2" y="306" fill="#a7f3d0">falls from the gripper…"<tspan fill="#cbd5e1">,</tspan></text>
    <text x="800.8" y="330" fill="#cbd5e1">"detection_lag_s": <tspan fill="#fbbf24">0.64</tspan>,</text>
    <text x="800.8" y="354" fill="#cbd5e1">"pre_event_complete": <tspan fill="#6ee7b7">true</tspan></text>
  </g>
</svg>
