<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="title" x1="80" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#243049" stroke-width="1.5"/>
  <ellipse cx="1050" cy="170" rx="360" ry="280" fill="url(#glow)"/>

  <!-- left: clock / rewind emblem -->
  <g transform="translate(150,170)" filter="url(#soft)">
    <circle r="92" fill="#0e1626" stroke="#2d3a52" stroke-width="2"/>
    <circle r="92" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="38 360" stroke-linecap="round" transform="rotate(-90)"/>
    <!-- rewind arrow -->
    <g stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 40 -34 A 52 52 0 1 1 -38 -28"/>
    </g>
    <path d="M -38 -50 L -38 -8 L -8 -29 Z" fill="#a78bfa"/>
    <!-- clock hands -->
    <circle r="6" fill="#34d399"/>
    <line x1="0" y1="0" x2="0" y2="-44" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="32" y2="14" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- title block -->
  <text x="300" y="150" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1">ROS Time Machine</text>
  <text x="302" y="196" font-size="25" font-weight="500" fill="#cbd5e1">Event-triggered recording for ROS&#160;2 — capture what happened</text>
  <text x="302" y="228" font-size="25" font-weight="500" fill="#cbd5e1"><tspan fill="#7dd3fc" font-weight="700">before</tspan> and <tspan fill="#34d399" font-weight="700">after</tspan> the moment that matters.</text>

  <!-- mini timeline strip -->
  <g transform="translate(302,266)">
    <rect x="0" y="0" width="300" height="14" rx="7" fill="#1b2538" stroke="#2d3a52"/>
    <rect x="0" y="0" width="150" height="14" rx="7" fill="#0ea5e9" opacity="0.55"/>
    <rect x="150" y="0" width="150" height="14" rx="7" fill="#10b981" opacity="0.55"/>
    <line x1="150" y1="-6" x2="150" y2="20" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="7" r="6" fill="#f87171"/>
    <text x="14" y="-8" font-size="13" fill="#7dd3fc" font-weight="600">PRE-EVENT BUFFER</text>
    <text x="222" y="-8" font-size="13" fill="#34d399" font-weight="600">POST-EVENT</text>
    <text x="640" y="11" font-size="15" fill="#64748b">⚡ trigger → snapshot.mcap</text>
  </g>
</svg>
