<svg width="1280" height="500" viewBox="0 0 1280 500" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="bar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c89a3"/>
    </marker>
    <marker id="barC" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <filter id="bsh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="500" rx="20" fill="url(#bbg)"/>
  <rect x="1" y="1" width="1278" height="498" rx="19" fill="none" stroke="#243049" stroke-width="1.5"/>
  <text x="64" y="56" font-size="28" font-weight="800" fill="#e2e8f0">Buffer strategy</text>
  <text x="64" y="86" font-size="16" fill="#94a3b8">One circular buffer per <tspan font-style="italic" fill="#cbd5e1">topic</tspan> — shared by every snapshot. A topic used by many snapshots is still buffered only once.</text>

  <text x="80" y="124" font-size="14" font-weight="700" fill="#7dd3fc" letter-spacing="0.4">CIRCULAR BUFFERS · one per topic, always recording</text>
  <text x="820" y="124" font-size="14" font-weight="700" fill="#6ee7b7" letter-spacing="0.4">SNAPSHOTS · each selects the topics it needs</text>

  <!-- ===== buffer cards (x80, w340, h72) ===== -->
  <!-- camera (shared) -->
  <g filter="url(#bsh)"><rect x="80" y="140" width="340" height="72" rx="12" fill="#06212f" stroke="#38bdf8" stroke-width="2"/></g>
  <rect x="80" y="140" width="6" height="72" rx="3" fill="#38bdf8"/>
  <text x="104" y="170" font-size="15.5" font-weight="700" fill="#7dd3fc">📷 /camera/image_raw</text>
  <text x="104" y="192" font-size="11.5" fill="#6aa6c9">last 5s · ~100 msgs</text>
  <g fill="#38bdf8" transform="translate(300,156)">
    <rect x="0" y="6" width="6" height="34" rx="2" opacity="0.5"/><rect x="11" y="6" width="6" height="34" rx="2" opacity="0.6"/>
    <rect x="22" y="6" width="6" height="34" rx="2" opacity="0.7"/><rect x="33" y="6" width="6" height="34" rx="2" opacity="0.8"/>
    <rect x="44" y="6" width="6" height="34" rx="2" opacity="0.9"/><rect x="55" y="6" width="6" height="34" rx="2"/>
  </g>
  <rect x="296" y="134" width="116" height="20" rx="10" fill="#0e2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="354" y="148" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">shared ×2</text>

  <!-- lidar -->
  <g filter="url(#bsh)"><rect x="80" y="226" width="340" height="72" rx="12" fill="#0e1a2c" stroke="#0ea5e9" stroke-width="1.5"/></g>
  <rect x="80" y="226" width="6" height="72" rx="3" fill="#0ea5e9"/>
  <text x="104" y="256" font-size="15.5" font-weight="700" fill="#7dd3fc">🎯 /lidar/points</text>
  <text x="104" y="278" font-size="11.5" fill="#6aa6c9">last 5s · ~50 msgs</text>
  <g fill="#0ea5e9" transform="translate(300,242)">
    <rect x="0" y="6" width="6" height="34" rx="2" opacity="0.5"/><rect x="11" y="6" width="6" height="34" rx="2" opacity="0.65"/>
    <rect x="22" y="6" width="6" height="34" rx="2" opacity="0.8"/><rect x="33" y="6" width="6" height="34" rx="2" opacity="0.9"/>
    <rect x="44" y="6" width="6" height="34" rx="2"/>
  </g>

  <!-- odom -->
  <g filter="url(#bsh)"><rect x="80" y="312" width="340" height="72" rx="12" fill="#0e1a2c" stroke="#0ea5e9" stroke-width="1.5"/></g>
  <rect x="80" y="312" width="6" height="72" rx="3" fill="#0ea5e9"/>
  <text x="104" y="342" font-size="15.5" font-weight="700" fill="#7dd3fc">🧭 /odom</text>
  <text x="104" y="364" font-size="11.5" fill="#6aa6c9">last 5s · ~200 msgs</text>
  <g fill="#0ea5e9" transform="translate(300,328)">
    <rect x="0" y="6" width="6" height="34" rx="2" opacity="0.5"/><rect x="11" y="6" width="6" height="34" rx="2" opacity="0.6"/>
    <rect x="22" y="6" width="6" height="34" rx="2" opacity="0.7"/><rect x="33" y="6" width="6" height="34" rx="2" opacity="0.85"/>
    <rect x="44" y="6" width="6" height="34" rx="2"/>
  </g>

  <!-- imu -->
  <g filter="url(#bsh)"><rect x="80" y="398" width="340" height="72" rx="12" fill="#0e1a2c" stroke="#0ea5e9" stroke-width="1.5"/></g>
  <rect x="80" y="398" width="6" height="72" rx="3" fill="#0ea5e9"/>
  <text x="104" y="428" font-size="15.5" font-weight="700" fill="#7dd3fc">📐 /imu/data</text>
  <text x="104" y="450" font-size="11.5" fill="#6aa6c9">last 5s · ~500 msgs</text>
  <g fill="#0ea5e9" transform="translate(300,414)">
    <rect x="0" y="6" width="6" height="34" rx="2" opacity="0.6"/><rect x="11" y="6" width="6" height="34" rx="2" opacity="0.75"/>
    <rect x="22" y="6" width="6" height="34" rx="2" opacity="0.9"/><rect x="33" y="6" width="6" height="34" rx="2"/>
  </g>

  <!-- ===== snapshot boxes ===== -->
  <!-- A: collision -->
  <g filter="url(#bsh)"><rect x="820" y="150" width="396" height="140" rx="14" fill="#062417" stroke="#10b981" stroke-width="1.5"/></g>
  <text x="844" y="184" font-size="17" font-weight="700" fill="#6ee7b7">🚗 collision_event</text>
  <text x="1196" y="184" font-size="12" fill="#5b9c84" text-anchor="end">pre 5s · post 10s</text>
  <g font-size="12.5" fill="#a7f3d0" text-anchor="middle">
    <rect x="844" y="204" width="150" height="28" rx="8" fill="#0a1f17" stroke="#10b981" stroke-opacity="0.5"/><text x="919" y="222">/camera/image_raw</text>
    <rect x="1006" y="204" width="110" height="28" rx="8" fill="#0a1f17" stroke="#10b981" stroke-opacity="0.5"/><text x="1061" y="222">/lidar/points</text>
    <rect x="844" y="242" width="80" height="28" rx="8" fill="#0a1f17" stroke="#10b981" stroke-opacity="0.5"/><text x="884" y="260">/odom</text>
  </g>

  <!-- B: high_accel -->
  <g filter="url(#bsh)"><rect x="820" y="330" width="396" height="120" rx="14" fill="#06231f" stroke="#14b8a6" stroke-width="1.5"/></g>
  <text x="844" y="364" font-size="17" font-weight="700" fill="#5eead4">📈 high_accel</text>
  <text x="1196" y="364" font-size="12" fill="#4f9b91" text-anchor="end">pre 3s · post 5s</text>
  <g font-size="12.5" fill="#99f6e4" text-anchor="middle">
    <rect x="844" y="384" width="150" height="28" rx="8" fill="#0a1f1c" stroke="#14b8a6" stroke-opacity="0.5"/><text x="919" y="402">/camera/image_raw</text>
    <rect x="1006" y="384" width="92" height="28" rx="8" fill="#0a1f1c" stroke="#14b8a6" stroke-opacity="0.5"/><text x="1052" y="402">/imu/data</text>
  </g>

  <!-- ===== arrows: buffer -> snapshots ===== -->
  <!-- camera -> A (shared, highlighted) -->
  <path d="M 420 168 C 600 168, 640 210, 816 215" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#barC)"/>
  <!-- camera -> B (shared, highlighted) -->
  <path d="M 420 184 C 600 320, 640 388, 816 392" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#barC)"/>
  <!-- lidar -> A -->
  <path d="M 420 262 C 580 262, 660 230, 816 230" stroke="#7c89a3" stroke-width="1.7" fill="none" marker-end="url(#bar)"/>
  <!-- odom -> A -->
  <path d="M 420 348 C 600 348, 660 256, 816 256" stroke="#7c89a3" stroke-width="1.7" fill="none" marker-end="url(#bar)"/>
  <!-- imu -> B -->
  <path d="M 420 434 C 600 434, 660 400, 816 400" stroke="#7c89a3" stroke-width="1.7" fill="none" marker-end="url(#bar)"/>

  <text x="618" y="478" font-size="13.5" fill="#64748b" text-anchor="middle">The <tspan fill="#7dd3fc" font-weight="700">/camera</tspan> buffer feeds both snapshots — buffered once, reused everywhere.</text>
</svg>
