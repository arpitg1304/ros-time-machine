<svg width="1280" height="450" viewBox="0 0 1280 450" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="lar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c89a3"/>
    </marker>
    <marker id="larR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fb7185"/>
    </marker>
    <filter id="lsh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="450" rx="20" fill="url(#lbg)"/>
  <rect x="1" y="1" width="1278" height="448" rx="19" fill="none" stroke="#243049" stroke-width="1.5"/>
  <text x="64" y="56" font-size="28" font-weight="800" fill="#e2e8f0">Recording lifecycle</text>
  <text x="64" y="86" font-size="16" fill="#94a3b8">A trigger drives one recording job through these states — then the system returns to idle, ready for the next.</text>

  <!-- loop-back arc -->
  <path d="M 1144 150 C 1144 116, 1144 116, 980 116 L 288 116 C 134 116, 134 116, 134 150" stroke="#7c89a3" stroke-width="1.4" fill="none" marker-end="url(#lar)" stroke-dasharray="5 4"/>
  <text x="639" y="110" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-style="italic">↻ ready for next trigger</text>

  <!-- happy-path states (y 150..214, w140, pitch 202) -->
  <g filter="url(#lsh)"><rect x="64" y="150" width="140" height="64" rx="12" fill="#161e2e" stroke="#64748b" stroke-width="1.5"/></g>
  <text x="134" y="180" font-size="16" font-weight="700" fill="#cbd5e1" text-anchor="middle">Idle</text>
  <text x="134" y="200" font-size="11.5" fill="#7c89a3" text-anchor="middle">buffering only</text>

  <g filter="url(#lsh)"><rect x="266" y="150" width="140" height="64" rx="12" fill="#1a1330" stroke="#a78bfa" stroke-width="1.5"/></g>
  <text x="336" y="180" font-size="16" font-weight="700" fill="#c4b5fd" text-anchor="middle">Triggered</text>
  <text x="336" y="200" font-size="11.5" fill="#9a86c9" text-anchor="middle">condition met</text>

  <g filter="url(#lsh)"><rect x="468" y="150" width="140" height="64" rx="12" fill="#06212f" stroke="#0ea5e9" stroke-width="1.5"/></g>
  <text x="538" y="180" font-size="15" font-weight="700" fill="#7dd3fc" text-anchor="middle">Dumping Buffer</text>
  <text x="538" y="200" font-size="11.5" fill="#6aa6c9" text-anchor="middle">pre-event slice</text>

  <g filter="url(#lsh)"><rect x="670" y="150" width="140" height="64" rx="12" fill="#062417" stroke="#10b981" stroke-width="1.5"/></g>
  <text x="740" y="180" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle">Recording</text>
  <text x="740" y="200" font-size="11.5" fill="#5b9c84" text-anchor="middle">live post-event</text>

  <g filter="url(#lsh)"><rect x="872" y="150" width="140" height="64" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.5"/></g>
  <text x="942" y="180" font-size="16" font-weight="700" fill="#5eead4" text-anchor="middle">Completing</text>
  <text x="942" y="200" font-size="11.5" fill="#4f9b91" text-anchor="middle">close &amp; flush</text>

  <g filter="url(#lsh)"><rect x="1074" y="150" width="140" height="64" rx="12" fill="#0a2615" stroke="#22c55e" stroke-width="1.5"/></g>
  <text x="1144" y="180" font-size="16" font-weight="700" fill="#86efac" text-anchor="middle">Completed</text>
  <text x="1144" y="200" font-size="11.5" fill="#5fa777" text-anchor="middle">status published</text>

  <!-- happy-path arrows + labels -->
  <g stroke="#7c89a3" stroke-width="1.7" marker-end="url(#lar)" fill="none">
    <path d="M 204 182 L 262 182"/>
    <path d="M 406 182 L 464 182"/>
    <path d="M 608 182 L 666 182"/>
    <path d="M 810 182 L 868 182"/>
    <path d="M 1012 182 L 1070 182"/>
  </g>
  <g font-size="11.5" fill="#94a3b8" text-anchor="middle">
    <text x="235" y="173">fire</text>
    <text x="437" y="173">ok</text>
    <text x="639" y="173">dumped</text>
    <text x="841" y="173">done</text>
    <text x="1043" y="173">saved</text>
  </g>

  <!-- branch: Rate Limited -->
  <g filter="url(#lsh)"><rect x="266" y="320" width="140" height="58" rx="12" fill="#2a0f1b" stroke="#fb7185" stroke-width="1.5"/></g>
  <text x="336" y="346" font-size="15" font-weight="700" fill="#fda4af" text-anchor="middle">Rate Limited</text>
  <text x="336" y="365" font-size="11.5" fill="#b8717f" text-anchor="middle">drop &amp; wait</text>
  <g stroke="#fb7185" stroke-width="1.6" marker-end="url(#larR)" fill="none">
    <path d="M 336 214 L 336 316"/>
  </g>
  <text x="348" y="270" font-size="11.5" fill="#fda4af" text-anchor="start" font-style="italic">limit exceeded</text>
  <path d="M 266 360 C 150 360, 134 360, 134 222" stroke="#7c89a3" stroke-width="1.4" fill="none" marker-end="url(#lar)" stroke-dasharray="5 4"/>

  <!-- branch: Failed -->
  <g filter="url(#lsh)"><rect x="704" y="320" width="140" height="58" rx="12" fill="#2a0f1b" stroke="#fb7185" stroke-width="1.5"/></g>
  <text x="774" y="346" font-size="15" font-weight="700" fill="#fda4af" text-anchor="middle">Failed</text>
  <text x="774" y="365" font-size="11.5" fill="#b8717f" text-anchor="middle">error logged</text>
  <g stroke="#fb7185" stroke-width="1.4" marker-end="url(#larR)" fill="none" opacity="0.85">
    <path d="M 538 214 C 538 290, 660 300, 716 330"/>
    <path d="M 740 214 L 762 316"/>
    <path d="M 942 214 C 942 290, 840 300, 828 318"/>
  </g>
  <text x="612" y="262" font-size="11.5" fill="#fda4af" text-anchor="middle" font-style="italic">on I/O error</text>
  <path d="M 704 372 C 360 410, 150 410, 134 222" stroke="#7c89a3" stroke-width="1.4" fill="none" marker-end="url(#lar)" stroke-dasharray="5 4"/>
</svg>
