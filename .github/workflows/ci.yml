name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jazzy:
    name: Build, test and time to first clip (Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (as the README says)
        run: |
          source /opt/ros/jazzy/setup.bash
          apt-get update
          apt-get install -y ros-dev-tools python3-pil python3-yaml python3-pytest
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Tests and linters
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test   # unit, launch and ament style tests (uncrustify, flake8, pep257, ...)
          colcon test-result --verbose
          python3 -m pytest -q deploy/vllm/tests

      - name: Time to first clip
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          scripts/check_first_clip.sh

  lerobot-rewind:
    name: lerobot-rewind (no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ffmpeg and the tool
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install "./tools/lerobot-rewind[test]"
      - name: Tests
        run: pytest -q tools/lerobot-rewind/tests
