name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jazzy:
    name: Build, test and time to first clip (Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (as the README says)
        run: |
          source /opt/ros/jazzy/setup.bash
          apt-get update
          apt-get install -y ros-dev-tools python3-pil python3-yaml python3-pytest
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Unit and launch tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # The ament style linters are skipped: they fail on code that predates v2
          colcon test --packages-select ros_time_machine --ctest-args -R \
            "test_(circular_buffer|pin_manager|trigger_queue|event_sidecar|config_manager|integration|event_trigger_integration)"
          colcon test --packages-select rtm_watcher rtm_vlm
          colcon test-result --verbose
          python3 -m pytest -q deploy/vllm/tests

      - name: Time to first clip
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          scripts/check_first_clip.sh
