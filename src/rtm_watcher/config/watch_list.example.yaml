# ROS Time Machine v2 - example watch list for the VLM watcher
#
# Describe the moments you care about in plain English. The watcher samples the
# cameras at sample_hz, shows the VLM the last context_frames frames plus a text
# summary of state_topics, and publishes a time-addressed EventTrigger for every
# credible detection. Time Machine then saves the profile's window around the
# frame where the event was seen - not around the moment the VLM answered.

watcher:
  # Any OpenAI-compatible server: vLLM, llama.cpp (llama-server), Ollama, SGLang.
  #   vllm serve Qwen/Qwen3-VL-4B-Instruct --max-model-len 8192
  endpoint: http://localhost:8000/v1
  model: qwen3-vl-4b-instruct
  # api_key_env: OPENAI_API_KEY      # name of the env var holding a key, if needed
  # allow_remote: false              # camera frames leave the site only if true
  # extra_body: {reasoning_effort: none}  # thinking models: 2x faster, no truncated JSON
  # image_detail: low                # hosted OpenAI-style APIs: far fewer image tokens
  # temperature: 0.0                 # unset = provider default (some models reject others)

  cameras:
    - /camera/front/image_raw/compressed
    - /camera/wrist/image_raw/compressed
  sample_hz: 1.0
  context_frames: 4                  # per camera
  max_image_px: 640                  # downscale before sending

  state_topics: [/joint_states, /gripper/state]   # summarized as text

  robot_context: "An SO-101 arm picks a red cup from the table and places it on a coaster."

  min_confidence: 0.6
  cooldown_s: 10                     # per label, in robot time

  events:
    - label: object_dropped
      describe: "An object falls out of the gripper or off the table."
      profile: manipulation
    - label: person_in_cell
      describe: "A person enters the robot's work area."
      profile: safety
      min_confidence: 0.5            # err on the side of saving
    - label: wrong_object
      describe: "The robot picks up something other than the red cup."
      profile: manipulation
    - label: task_success
      describe: "The cup is placed upright on the coaster."
      profile: episodes
      sample_rate: 0.2               # keep 20% of these
      pre_event: 20.0                # whole episode, not just the moment
      post_event: 2.0
      tags: [episode]

  # Cascade: cheap always-on scorers pin a window the moment something looks off;
  # the VLM judges only those windows and keeps or releases the pin. Fast contact
  # events that 1 fps sampling would miss are caught here.
  #   ros2 run rtm_watcher effort_scorer          # publishes /effort_scorer/score
  history_s: 30                      # sampled frames kept for judging
  judge_frames: 8
  scorers:
    - topic: /effort_scorer/score
      profile: manipulation
      calibration_s: 60              # first minute = normal operation
      alpha: 0.005                   # target false-pin rate per score sample
      pre_event: 5.0
      post_event: 3.0
      ttl_s: 20                      # no verdict in time -> profile's pins.timeout_policy
    # - topic: /fiper/score          # any std_msgs Float32/Float64 runtime monitor
    #   threshold: 0.8               # fixed instead of calibrated
    #   judge: false                 # let the timeout policy decide
