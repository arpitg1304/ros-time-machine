snapshots:
  - name: "test_snapshot"
    description: "Test snapshot configuration"

    trigger:
      topic: "/test/trigger"
      msg_type: "std_msgs/msg/Bool"
      condition:
        field: "data"
        operator: "=="
        value: 1.0

    recording:
      topics:
        - "/camera/image"
        - "/lidar/points"
      pre_event_duration: 2.0
      post_event_duration: 3.0
      max_buffer_size: 100

    rate_limit:
      max_triggers_per_minute: 10
      window_size: 60

    output:
      path: "/tmp/test_snapshots"
      name_pattern: "{snapshot_name}_{timestamp}"
      format: "mcap"

global:
  max_total_buffer_memory: 500
  recording_threads: 2
  log_level: "INFO"
  publish_stats: true
